version: '3.8'

services:
  database:
    image: postgres:16-alpine
    container_name: attribute-gis-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: attribute_mission
      POSTGRES_USER: gis_admin
      POSTGRES_PASSWORD: gis_secret_pass
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gis_admin -d attribute_mission"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
